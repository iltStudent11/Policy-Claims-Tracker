services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./capstone-api
      dockerfile: Dockerfile
    image: capstone-api:local
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      PORT: "5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./capstone-client
      dockerfile: Dockerfile
    image: capstone-client:local
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mongo_data:
