apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: policy-claims
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: policy-claims
type: Opaque
stringData:
  MONGODB_URI: mongodb://mongo:27017/policy-claims
---
apiVersion: v1
kind: Secret
metadata:
  name: api-config-secret
  namespace: policy-claims
type: Opaque
stringData:
  PORT: "4000"
  NODE_ENV: production
